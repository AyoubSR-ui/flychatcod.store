kind = "web"
previewPath = "/"
title = "FlyChat COD"
version = "1.0.0"
id = "artifacts/flychat"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21894
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/flychat run dev"

[services.env]
PORT = "21894"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/flychat", "run", "build"]
publicDir = "artifacts/flychat/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
